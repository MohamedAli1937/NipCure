services:
  - type: web
    name: nipcure-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nipcure-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Gemma 3 via HuggingFace Inference API (free tier)
      - key: GEMMA_PROVIDER
        value: "huggingface"
      - key: GEMMA_MODEL
        value: "google/gemma-3-4b-it"
      - key: HF_TOKEN
        sync: false
      # Optional: ElevenLabs TTS
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: "21m00Tcm4TlvDq8ikWAM"
      # Optional: SerpApi research
      - key: SERPAPI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: nipcure-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: echo "No build needed"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  - name: nipcure-db
    databaseName: nipcure
    user: nipcure
    plan: free
    region: oregon
